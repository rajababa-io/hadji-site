name: Build docs
# docs-src/**/*.md -> docs/ (pages, manifest.json, article.md). The result is committed
# to main, and GitHub Pages serves main. docs/media/ is never touched by the build.
on:
  push:
    branches: [main]
    paths: ['docs-src/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: docs-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-docs.mjs
      - name: Commit the build
        run: |
          git config user.name "hadji-docs-bot"
          git config user.email "docs-bot@hadji.ai"
          git add docs
          git diff --cached --quiet || (git commit -m "Build docs [skip ci]" && git pull --rebase origin main && git push)
